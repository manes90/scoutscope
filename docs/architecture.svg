<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00a8e8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e5a0"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#0b0e14"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#e8ecf3">ScoutScope — how data becomes a coaching decision</text>
  <text x="30" y="60" font-size="13" fill="#9aa5b8">Every percentage on screen is events ÷ defensive rounds analysed, with the numerator and denominator shown.</text>

  <!-- Row 1: pipeline boxes -->
  <g font-size="13">
    <rect x="30" y="90" width="170" height="120" rx="10" fill="#12161f" stroke="#262e3f"/>
    <text x="45" y="118" font-size="14" font-weight="700" fill="#ffd23f">1 · Data in</text>
    <text x="45" y="142" fill="#e8ecf3">Demo dataset</text>
    <text x="45" y="160" fill="#9aa5b8">(synthetic, 240 rounds,</text>
    <text x="45" y="178" fill="#9aa5b8">12 matches, 3 maps)</text>
    <text x="45" y="198" fill="#e8ecf3">or GRID CSV import</text>

    <rect x="220" y="90" width="170" height="120" rx="10" fill="#12161f" stroke="#262e3f"/>
    <text x="235" y="118" font-size="14" font-weight="700" fill="#ffd23f">2 · Events</text>
    <text x="235" y="142" fill="#e8ecf3">one row per ability cast</text>
    <text x="235" y="160" fill="#9aa5b8">{map, team, player,</text>
    <text x="235" y="178" fill="#9aa5b8">agent, ability, x, y,</text>
    <text x="235" y="196" fill="#9aa5b8">side, roundTime}</text>

    <rect x="410" y="90" width="170" height="120" rx="10" fill="#12161f" stroke="#262e3f"/>
    <text x="425" y="118" font-size="14" font-weight="700" fill="#ffd23f">3 · Filters</text>
    <text x="425" y="142" fill="#e8ecf3">opponent · map · side</text>
    <text x="425" y="160" fill="#e8ecf3">player · ability</text>
    <text x="425" y="178" fill="#9aa5b8">every tab follows the</text>
    <text x="425" y="196" fill="#9aa5b8">same filters</text>

    <rect x="600" y="90" width="170" height="120" rx="10" fill="#12161f" stroke="#00a8e8"/>
    <text x="615" y="118" font-size="14" font-weight="700" fill="#00a8e8">4 · Insight engine</text>
    <text x="615" y="142" fill="#e8ecf3">frequencies (events ÷</text>
    <text x="615" y="160" fill="#e8ecf3">rounds) · heat density</text>
    <text x="615" y="178" fill="#e8ecf3">Operator profile ·</text>
    <text x="615" y="196" fill="#e8ecf3">anti-strat playbook</text>

    <rect x="790" y="90" width="180" height="120" rx="10" fill="#12161f" stroke="#262e3f"/>
    <text x="805" y="118" font-size="14" font-weight="700" fill="#ffd23f">5 · Render</text>
    <text x="805" y="142" fill="#e8ecf3">6 tabs: Overview ·</text>
    <text x="805" y="160" fill="#e8ecf3">Heatmap · Profiler ·</text>
    <text x="805" y="178" fill="#e8ecf3">Anti-Strat · Planner ·</text>
    <text x="805" y="196" fill="#e8ecf3">Data &amp; Evidence</text>
  </g>
  <!-- arrows row 1 -->
  <g stroke="#00a8e8" stroke-width="2" fill="none">
    <line x1="200" y1="150" x2="218" y2="150" marker-end="url(#arr)"/>
    <line x1="390" y1="150" x2="408" y2="150" marker-end="url(#arr)"/>
    <line x1="580" y1="150" x2="598" y2="150" marker-end="url(#arr)"/>
    <line x1="770" y1="150" x2="788" y2="150" marker-end="url(#arr)"/>
  </g>

  <!-- Row 2: verification loop -->
  <rect x="30" y="260" width="940" height="110" rx="10" fill="#171c28" stroke="#00e5a0"/>
  <text x="45" y="288" font-size="14" font-weight="700" fill="#00e5a0">Verify, don’t trust — three independent checks on the same files</text>
  <g font-size="13" fill="#e8ecf3">
    <text x="45" y="316">•  Node smoke test (test/smoke-test.js) — 23 checks: dataset integrity, insight math, exact tendencies</text>
    <text x="45" y="338">•  IntelliJ headless inspection (bin/inspect.sh) — 90+ JS / HTML / CSS inspections, results in inspections/RESULTS.md</text>
    <text x="45" y="360">•  Headless-Chromium capture (Playwright) — every tab screenshotted + recorded, zero JS errors</text>
  </g>
  <!-- arrow back up to the engine -->
  <g stroke="#00e5a0" stroke-width="2" fill="none">
    <path d="M 685 260 L 685 222" marker-end="url(#arrG)"/>
  </g>
  <text x="695" y="244" font-size="12" fill="#00e5a0">bugs found feed back into the engine</text>

  <text x="30" y="410" font-size="13" fill="#9aa5b8">Static web app — no framework, no build step, no server required. Open source under the MIT License.</text>
  <text x="30" y="432" font-size="13" fill="#9aa5b8">Maps are original schematic diagrams (not to scale, no Riot artwork). Demo data is fictional and labelled as such.</text>
</svg>
